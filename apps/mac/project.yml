name: CommsCoachMac
options:
  bundleIdPrefix: com.kaungzinhein.commscoach
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ScreenContextCore:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: LVG4WJ7M59
    # Apple Development identity, no provisioning profile: a stable signature keeps the
    # Screen Recording grant across rebuilds. No sandbox, no notarization (local builds only).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CommsCoachMac:
    type: application
    platform: macOS
    sources:
      - path: CommsCoachMac
    dependencies:
      - package: ScreenContextCore
        product: ScreenContextCore
    info:
      path: CommsCoachMac/Info.plist
      properties:
        CFBundleDisplayName: Comms Coach
        CFBundleName: Comms Coach
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Comms Coach listens only while you hold Control-Option-T. That one recording is sent for a voice reply, then deleted from this Mac."
        NSCameraUsageDescription: "Only if you turn on Use the Camera During Practice: while you hold Control-Option-T, Comms Coach checks on this Mac which way your head points. No picture is saved or sent, unless you turn on the hands check for a round: then a short silent clip of that round goes to Meta's SAM 3.1 and only the seconds are kept."
        NSCameraUseContinuityCameraDeviceType: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaungzinhein.commscoach.mac
        # REPLAY builds the per-round hands check (CommsCoachMac/ReplayCheck.swift); without it the toggle never shows.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REPLAY"
        PRODUCT_NAME: CommsCoachMac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
