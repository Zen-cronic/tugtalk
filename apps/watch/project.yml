name: CommsCoachWatch
options:
  bundleIdPrefix: com.kaungzinhein.commscoach
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SparringCore:
    path: SparringCore
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: LVG4WJ7M59
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Raise CURRENT_PROJECT_VERSION for every build uploaded to App Store Connect.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  # Store wrapper for the watch-only app, as in Xcode's Watch-only App template:
  # an iOS stub with no executable that carries the watch app under Watch/ and
  # holds the App Store Connect bundle ID. Archive this target.
  CommsCoach:
    type: application.watchapp2-container
    platform: iOS
    dependencies:
      - target: CommsCoachWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaungzinhein.commscoach.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TugTalk
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          VALIDATE_PRODUCT: YES
  CommsCoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: CommsCoachWatch
    dependencies:
      - package: SparringCore
    preBuildScripts:
      # Release only: refuses an empty or placeholder connector key, so an archive never ships without one.
      - name: Check the connector key (Release)
        script: '/bin/sh "${SCRIPT_INPUT_FILE_0}"'
        inputFiles:
          - $(SRCROOT)/Tools/check-release-key.sh
        basedOnDependencyAnalysis: false
    info:
      path: CommsCoachWatch/Info.plist
      properties:
        CFBundleDisplayName: TugTalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Records a short practice answer you choose to capture, so your coach can measure fillers, unsure words, pace and restarts, and ask you a follow-up question. Audio is uploaded once and not kept unless you turn on Keep my recordings.
        CoachAPIBaseURL: $(COACH_API_BASE_URL)
        CoachAPIToken: $(COACH_API_TOKEN)
        UIAppFonts:
          - Anybody-Variable.ttf
          - HankenGrotesk-Variable.ttf
          - AzeretMono-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaungzinhein.commscoach.watch.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded in the CommsCoach wrapper, which is the target that installs into the archive.
        SKIP_INSTALL: YES
schemes:
  # Archive and upload: builds the wrapper with the watch app inside it.
  CommsCoach:
    build:
      targets:
        CommsCoach: all
        CommsCoachWatch: all
    run:
      config: Debug
    archive:
      config: Release
  # Simulator and device runs of the watch app itself.
  CommsCoachWatch:
    build:
      targets:
        CommsCoachWatch: all
    run:
      config: Debug
    archive:
      config: Release
